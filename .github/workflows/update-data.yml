name: Update MarioBola Data

on:
  workflow_dispatch:

  push:
    paths:
      - "input/*.txt"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/update-data.yml"

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Football Logos database
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/hixcoder/football-teams-flags/main/football_teams.json" \
            -o data/football-teams.json

          echo "Football Logos database downloaded:"
          wc -c data/football-teams.json

      - name: Parse TXT jadwal dan prediksi
        run: npm run update

      - name: Resolve team logos
        run: npm run resolve-logos

      - name: Update league standings
        run: npm run update-standings

      - name: Update live scores
        run: npm run update-live-scores

      - name: Validate generated data
        run: npm run validate-data

      - name: Update editorial news
        continue-on-error: true
        run: npm run update-news

      - name: Show generated data summary
        run: |
          echo "======================================"
          echo " MARIOBOLA BUILD SUMMARY"
          echo "======================================"

          node --input-type=module -e "
          import fs from 'node:fs';

          const d = JSON.parse(
            fs.readFileSync('./data/schedule.json', 'utf8')
          );

          console.log(
            'Matches       :',
            Array.isArray(d.matches) ? d.matches.length : 0
          );

          console.log(
            'Predictions   :',
            d.matchedPredictions ?? 0
          );

          console.log(
            'With home logo:',
            Array.isArray(d.matches)
              ? d.matches.filter(x => x.homeCrest).length
              : 0
          );

          console.log(
            'With away logo:',
            Array.isArray(d.matches)
              ? d.matches.filter(x => x.awayCrest).length
              : 0
          );
          "

          echo ""
          echo "======================================"
          echo " LIVE SCORE SUMMARY"
          echo "======================================"

          node --input-type=module -e "
          import fs from 'node:fs';

          const file = './data/live-scores.json';

          if (!fs.existsSync(file)) {
            console.log('live-scores.json tidak ditemukan.');
            process.exit(0);
          }

          const d = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log(
            'Live matches  :',
            d.summary?.live ?? 0
          );

          console.log(
            'Upcoming      :',
            d.summary?.upcoming ?? 0
          );

          console.log(
            'Finished      :',
            d.summary?.finished ?? 0
          );

          console.log(
            'Total events  :',
            d.summary?.totalEvents ?? 0
          );

          console.log(
            'Leagues OK    :',
            d.summary?.successfulLeagues ?? 0,
            '/',
            d.summary?.leagues ?? 0
          );
          "

          echo "======================================"

      - name: Commit generated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== STAGING GENERATED DATA ==="

          git add data/
          git add assets/home-leagues/ || true
          git add assets/home/ || true

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi

          git commit -m "chore: update MarioBola generated data"

          echo "=== SYNC WITH REMOTE MAIN ==="

          git fetch origin main

          git rebase origin/main

          echo "=== PUSH GENERATED DATA ==="

          git push origin HEAD:main
